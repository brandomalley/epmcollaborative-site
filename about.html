<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About: Brandon O'Malley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://calendar.google.com/calendar/scheduling-button-script.css" rel="stylesheet">
  <script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F5F1;
      --ink: #1C1C1A;
      --ink-soft: #555552;
      --ink-muted: #9A9893;
      --rose: #913D65;
      --teal: #198A7F;
      --midnight: #212F3C;
      --border: rgba(28,28,26,0.1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 22px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cream);
      z-index: 100;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    nav.scrolled { border-bottom-color: var(--border); }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .nav-brand svg { height: 26px; width: auto; }
    .nav-brand-name {
      font-family: 'Righteous', sans-serif;
      font-size: 0.95rem;
      color: var(--midnight);
      letter-spacing: 0.01em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 44px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-size: 0.875rem;
      color: var(--ink-soft);
      font-weight: 400;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links .book-link {
      color: var(--ink);
      font-weight: 500;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }
    .nav-links .active { color: var(--ink); font-weight: 500; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 160px 60px 100px;
      border-bottom: 1px solid var(--border);
    }
    .page-header-inner { max-width: 1160px; margin: 0 auto; }
    .header-with-photo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 80px;
    }
    .header-text { flex: 1; }
    .header-photo {
      width: 280px;
      height: 280px;
      object-fit: cover;
      object-position: center top;
      flex-shrink: 0;
      align-self: center;
    }
    .page-eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 500;
      margin-bottom: 40px;
    }
    .page-intro {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 400;
      line-height: 1.45;
      color: var(--ink);
      max-width: 860px;
      letter-spacing: -0.01em;
    }
    .page-intro + .page-intro { margin-top: 24px; }
    .page-intro strong { font-weight: 600; }

    /* ── BAND ── */
    .band {
      border-top: 1px solid var(--border);
      padding: 100px 60px;
    }
    .band-inner {
      max-width: 1160px;
      margin: 0 auto;
    }

    /* ── SPLIT LAYOUT ── */
    .split {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0 80px;
      align-items: start;
    }
    .split-label {
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 500;
      padding-top: 6px;
      line-height: 1;
    }

    /* ── BODY TEXT ── */
    .body-text {
      font-size: 1.1rem;
      line-height: 1.75;
      color: var(--ink-soft);
      max-width: 680px;
    }
    .body-text strong { color: var(--ink); font-weight: 500; }
    .body-text p + p { margin-top: 22px; }

    /* ── CAREER LIST ── */
    .career-list { list-style: none; max-width: 720px; }
    .career-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 24px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }
    .career-item:first-child { border-top: 1px solid var(--border); }
    .career-role {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
    }
    .career-company {
      font-size: 0.875rem;
      color: var(--ink-soft);
      margin-top: 2px;
    }
    .career-dates {
      font-size: 0.78rem;
      color: var(--ink-muted);
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* ── HOW I WORK ── */
    .how-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px 60px;
      max-width: 760px;
    }
    .how-item-title {
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .how-item-body {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--ink-soft);
    }

    /* ── BOOK SECTION ── */
    .book-band {
      border-top: 1px solid var(--border);
      padding: 100px 60px;
    }
    .book-inner { max-width: 1160px; margin: 0 auto; }
    .book-heading {
      font-size: clamp(2.4rem, 4.5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.05;
      color: var(--ink);
      max-width: 640px;
      margin-bottom: 16px;
    }
    .book-sub {
      font-size: 1rem;
      color: var(--ink-muted);
      margin-bottom: 52px;
      max-width: 480px;
    }
    .cal-button-wrap script { display: none; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 36px 60px;
    }
    .footer-row {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-copy { font-size: 0.78rem; color: var(--ink-muted); }
    .footer-nav {
      list-style: none;
      display: flex;
      gap: 36px;
    }
    .footer-nav a {
      font-size: 0.78rem;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-nav a:hover { color: var(--ink); }

    /* ── BOOK BUTTON (mobile direct link) ── */
    .cal-mobile-link { display: none; }
    .cal-mobile-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      background: var(--rose);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    .cal-mobile-btn:hover { opacity: 0.88; }

    /* ── RESPONSIVE ── */
    @media (max-width: 800px) {
      nav { padding: 20px 24px; }
      .nav-links { gap: 24px; }
      .page-header { padding: 120px 24px 72px; }
      .band { padding: 72px 24px; }
      .split {
        grid-template-columns: 1fr;
        gap: 16px 0;
      }
      .how-grid { grid-template-columns: 1fr; gap: 32px; }
      .career-item { grid-template-columns: 1fr; }
      .career-dates { margin-top: 4px; }
      .book-band { padding: 72px 24px; }
      footer { padding: 32px 24px; }
      .footer-row { flex-direction: column; gap: 20px; align-items: flex-start; }
      .header-with-photo { flex-direction: column-reverse; gap: 40px; }
      .header-photo { width: 180px; height: 180px; }

      /* Swap Google widget for a direct link on mobile */
      .cal-button-wrap { display: none; }
      .cal-mobile-link { display: block; }
    }

    /* ── SMALL PHONES (≤ 480px) ── */
    @media (max-width: 480px) {
      .nav-brand-name { display: none; }
      .nav-links { gap: 20px; }
    }
  </style>
</head>
